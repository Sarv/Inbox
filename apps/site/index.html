<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Download Sarv Inbox</title>
    <meta
      name="description"
      content="Download Sarv Inbox, the privacy-first IMAP email client, for macOS, Windows and Linux."
    />
  </head>
  <body>
    <main class="page">
      <header class="row page-header">
        <img class="app-icon" data-app-icon alt="" width="48" height="48" />
        <div class="stack-2">
          <span class="app-name">Sarv Inbox</span>
          <span class="muted text-sm">Privacy-first email for your desktop</span>
        </div>
      </header>
      <div id="app" class="stack page-body" aria-live="polite">
        <p class="muted">Finding the right download for your device…</p>
        <noscript>
          <a class="btn btn-primary btn-lg" href="https://github.com/Sarv/Inbox/releases/latest"
            >Open the latest release</a
          >
        </noscript>
      </div>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
