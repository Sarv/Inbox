version: 2
updates:
  # JavaScript/TypeScript dependencies (pnpm workspace — Dependabot reads the
  # root pnpm-lock.yaml and updates all workspace packages).
  #
  # Quiet by design: one grouped PR a month for every minor and patch release,
  # and no major versions at all. A major is an upgrade to plan, not a bump to
  # merge: in October 2026 one weekly run opened 12 PRs, and TypeScript 7,
  # @types/node 26 and lru-cache 11 each needed real work (#55, #60, #63).
  # Security is covered separately: Dependabot alerts stay on, and CI's audit
  # gate fails the build on any high or critical advisory, whatever this file
  # says.
  #
  # No `labels`: Dependabot only applies labels that already exist in the repo,
  # so a configured one that is missing turns into a warning on every PR.
  # Without the key it uses its default `dependencies` label and creates it.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      # Every major, for every package. Some that must stay held back even when
      # upgrading by hand:
      # - typescript: 7 is the native (Go) compiler, and typescript-eslint and
      #   tsup's declaration build need the JavaScript compiler API it removes.
      # - @types/node: must match the oldest Node the code runs on (engines
      #   >= 22; Electron 44 ships Node 24), or code type-checks against APIs
      #   that crash at runtime.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions used by the CI workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
