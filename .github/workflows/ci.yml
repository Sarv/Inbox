name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

env:
  # Turbo replays unchanged tasks from here; .github/actions/setup-workspace
  # restores and saves it. Job-level, because a composite action cannot set env
  # for the steps that follow it.
  TURBO_CACHE_DIR: .turbo
  TURBO_TELEMETRY_DISABLED: '1'

# Every job below is independent and starts at once — nothing here uses `needs`.
# A red lint no longer hides a red test, and the wall-clock cost of CI is its
# slowest job rather than the sum of all of them.
jobs:
  # `pnpm type-check` is `turbo run type-check`, whose pipeline entry depends on
  # `^build` — turbo builds @sarvinbox/core and @sarvinbox/storage-node itself,
  # and caches them. Building them in an explicit step first only did the same
  # work outside the cache.
  type-check:
    name: Type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - run: pnpm type-check

  # Its own job rather than a step after type-check: lint depends on no build
  # output, so there is no reason for it to wait for one.
  # Zero errors required. Warnings (e.g. no-explicit-any) do not fail CI.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - run: pnpm lint

  # Guard: fail the PR if any Node-only module (mailparser / imapflow / nodemailer
  # / better-sqlite3 / …) has leaked into the RENDERER bundle. Such a leak crashes
  # the packaged app on startup with 'Dynamic require of "stream" is not supported'
  # — a bug that has shipped to a user before. A fast renderer-only build runs the
  # exact same guard the release build carries, so the crash can never reach a
  # user.
  renderer-bundle-guard:
    name: Renderer bundle guard (no Node-only deps)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - run: pnpm --filter @sarvinbox/desktop check:renderer-bundle

  # The regression gate: every unit + integration suite, on every push and PR.
  # This is what stops a new feature silently breaking sync, sending or storage —
  # type-check and lint cannot catch behavioural regressions.
  test:
    name: Unit & integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace

      # turbo runs the packages' suites concurrently and builds the libraries
      # they depend on first (`^build`), so no separate build step is needed.
      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage/
            apps/desktop/coverage/
          if-no-files-found: ignore
          retention-days: 14

  # The job above runs on Linux, so code that only does something on Windows
  # was never exercised: the Mark-of-the-Web NTFS stream (and its surviving the
  # rename / hard-link commit a save makes), and the OAuth loopback listeners'
  # close-and-rebind on one port, where Windows' sockets differ (overlapped
  # writes, port reuse). This runs just those suites, on Windows, with the
  # normal install. None of them opens SQLite, so no native-ABI step is needed.
  # windows-signing-workflows.test.ts checks every listed file exists, so a
  # rename cannot quietly drop a suite from here.
  windows-unit-tests:
    name: Windows-specific unit tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace

      # The desktop suites import @sarvinbox/core and storage-node from dist —
      # the same `^build` the test task runs, through turbo's cache.
      - name: Build the libraries the desktop tests import
        shell: bash
        run: pnpm exec turbo run build --filter='@sarvinbox/desktop^...'

      # --testTimeout: a connection to a closed localhost port is refused only
      # after Windows retries the SYN (about two seconds), and the loopback
      # suite checks that ports are closed many times over.
      - name: Run the Windows-relevant suites
        shell: bash
        working-directory: apps/desktop
        run: >-
          pnpm exec vitest run --testTimeout=60000
          test/unit/electron/services/mark-downloaded.test.ts
          test/unit/electron/services/attachment-save-marks-downloaded.test.ts
          test/unit/electron/services/oauth-loopback.test.ts
          test/unit/electron/utils/loopback-callback-headers.test.ts
          test/unit/electron/services/antivirus-oauth-service.test.ts

  # The release signs Windows binaries with an HSM key that only a pushed v*
  # tag can reach, so without this the signing code would run for the first
  # time on the very release that switches signing on. This runs the SAME
  # code -- scripts/lib/windows-signing.mjs's signPeFile, the real jsign at
  # its pinned digest, real RFC 3161 timestamps, and the release verifier on
  # Windows' own Get-AuthenticodeSignature -- with a throwaway self-signed
  # certificate trusted only on this runner. Only the signer differs (PKCS12
  # here, Cloud KMS in the release). It proves: files get signed, timestamped
  # and attributed to the right subject; a second sign call is a no-op; an
  # unsigned file fails verification; a file already signed by someone else
  # keeps that signature (accepted on a DLL or helper, refused on our own
  # executables).
  windows-signing-selftest:
    name: Windows signing self-test (jsign + Authenticode)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      SELFTEST_PUBLISHER: Sarv Inbox CI Self-Test Publisher
      SELFTEST_UPSTREAM: Sarv Inbox CI Upstream Signer
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace

      - name: Set up Java for jsign
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Fetch the pinned jsign
        id: jsign
        shell: bash
        run: node scripts/windows-signing.mjs fetch-jsign --dest "$RUNNER_TEMP/jsign" --github-output

      # Two throwaway certificates: ours, and an "upstream" one standing in
      # for Microsoft's signature on d3dcompiler_47.dll (and for a helper such
      # as elevate.exe that arrives already signed). Trusted in the
      # machine Root and TrustedPublisher stores of THIS ephemeral runner only,
      # so Get-AuthenticodeSignature reports them Valid. Windows PowerShell
      # (not pwsh): its Add-Type can still compile a console executable,
      # which is the unsigned PE every test file is copied from.
      - name: Create throwaway code-signing certificates and an unsigned binary
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'winsign-selftest'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $password = [guid]::NewGuid().ToString('N')
          Write-Output "::add-mask::$password"
          [IO.File]::AppendAllText($env:GITHUB_ENV, "SARV_WINDOWS_SIGNING_SELFTEST_PASSWORD=$password`n")
          $secure = ConvertTo-SecureString -String $password -Force -AsPlainText
          foreach ($name in 'self', 'other') {
            $subject = if ($name -eq 'self') { $env:SELFTEST_PUBLISHER } else { $env:SELFTEST_UPSTREAM }
            $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=$subject" `
              -KeyAlgorithm RSA -KeyLength 3072 -HashAlgorithm SHA256 -KeyExportPolicy Exportable `
              -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddDays(2)
            Export-PfxCertificate -Cert $cert -FilePath (Join-Path $dir "$name.p12") -Password $secure | Out-Null
            $cer = Join-Path $dir "$name.cer"
            Export-Certificate -Cert $cert -FilePath $cer | Out-Null
            Import-Certificate -FilePath $cer -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
            Import-Certificate -FilePath $cer -CertStoreLocation Cert:\LocalMachine\TrustedPublisher | Out-Null
          }
          Add-Type -OutputAssembly (Join-Path $dir 'unsigned.exe') -OutputType ConsoleApplication -TypeDefinition @'
          public static class Program { public static int Main() { return 0; } }
          '@

      - name: Sign and verify with the release signing code
        shell: bash
        env:
          JSIGN_JAR: ${{ steps.jsign.outputs.path }}
        run: node scripts/windows-signing-selftest.mjs "$RUNNER_TEMP/winsign-selftest"

  audit:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # No install: `pnpm audit` reads pnpm-lock.yaml, not node_modules.
      - uses: ./.github/actions/setup-workspace
        with:
          install: 'false'

      # Fail the build on HIGH or CRITICAL advisories in the dependency tree.
      # Dependabot keeps versions current; this gate catches a known-vulnerable
      # package landing between bumps. Moderate/low are reported but non-blocking.
      #
      # Advisories with no available fix are listed in pnpm.auditConfig.ignoreCves
      # in the root package.json and justified, one row each, in SECURITY.md.
      - name: pnpm audit (high+)
        run: pnpm audit --audit-level=high

      # Non-blocking, and deliberately AFTER the gate: ignoreCves hides those
      # advisories from the gate, and pnpm offers no flag to un-hide them, so
      # this drops the ignore list on the runner's throwaway copy of
      # package.json and re-runs. A fix landing for an ignored CVE — or a new
      # path appearing for one — shows up here instead of staying hidden.
      - name: Full report (including ignored advisories, non-blocking)
        if: always()
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));delete p.pnpm.auditConfig;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          pnpm audit --audit-level=high || true
          git checkout -- package.json
