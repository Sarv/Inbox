name: Release

# Triggered by pushing a vX.Y.Z tag, which `scripts/release.sh` does for you.
# Builds every platform on its OWN runner: better-sqlite3 is a compiled addon
# and cannot be cross-compiled ACROSS operating systems, so a macOS machine
# physically cannot produce a working Linux or Windows build. Cross-compiling
# between arches of the SAME OS does work, which is why macOS and Windows each
# build both of theirs on one runner.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing vX.Y.Z tag to (re)build'
        required: true

# Default to read-only; only the publish job is granted write.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never kill a half-finished release build

# NOTE: deliberately NOT SARVINBOX_SKIP_ELECTRON_REBUILD — the `build` job below
# packages the app, whose native addons must be built for Electron's ABI. Only
# the `verify` job skips it, which .github/actions/setup-workspace does for it.
env:
  TURBO_CACHE_DIR: .turbo
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  # A release must not be cut from a red tree. CI runs this on every push, but
  # a tag can point at any commit, so it is re-verified here rather than assumed.
  verify:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # The same setup CI uses: pnpm, Node, a warm turbo cache, and an install
      # that skips the Electron ABI rebuild. The suites run in plain Node, so
      # that rebuild would only make every SQLite-backed test fail with
      # ERR_DLOPEN_FAILED. See CLAUDE.md.
      - uses: ./.github/actions/setup-workspace

      # No explicit library build: both turbo tasks depend on `^build`, so
      # @sarvinbox/core and @sarvinbox/storage-node are built (and cached) here.
      - name: Type-check
        run: pnpm type-check

      - name: Test
        run: pnpm test

  build:
    name: ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90 # notarization alone can take 20+ minutes
    env:
      # Evaluated once at job level: a step cannot read env it sets on itself,
      # and this gates both signing and the verification step below.
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE_P12 != '' }}
    strategy:
      fail-fast: false # one platform failing must not discard the others
      matrix:
        include:
          - name: macOS (universal)
            id: mac-universal
            os: macos-latest
            platform: mac
            # Both macOS arches build on one runner: Xcode ships both SDKs, so
            # the native addons cross-compile between arm64 and x64 fine. This
            # is the ONLY cross-arch case that works.
            #
            # --universal packs each arch separately and then merges them with
            # lipo into ONE fat binary, so the job emits a single dmg and a
            # single zip instead of one of each per arch. Users stop having to
            # know which Mac they own; the cost is that each download carries
            # both slices. The merge is strict -- it refuses to reconcile files
            # that differ between the two packs -- which is why build.files
            # excludes the node-gyp intermediates (obj/, .deps/) whose contents
            # are arch-specific.
            args: --mac --universal
            # The binary inside the .app bundle, launched directly: `open`
            # returns before the app has done anything.
            smoke: apps/desktop/release/mac-universal/Sarv Inbox.app/Contents/MacOS/Sarv Inbox
          # Each Linux arch gets its OWN runner: unlike Xcode and MSVC, the
          # stock gcc on a GitHub runner has no cross toolchain, so the arm64
          # machine cannot compile x64 (`cc: unrecognized command-line option
          # '-m64'`) and vice versa. The --x64/--arm64 flag below is therefore
          # load-bearing, which is why build.linux.target pins no arch of its
          # own -- electron-builder prefers a config arch over the CLI one and
          # would make every runner try to build both.
          #
          # The runner image is ALSO load-bearing, and must stay PINNED to the
          # oldest distro we support -- never `ubuntu-latest`. glibc is
          # backward compatible and never forward: a native addon linked on a
          # newer glibc binds the newest versioned symbols it can see, and then
          # refuses to load anywhere older. `ubuntu-latest` floats forward on
          # its own schedule, so it silently raised that floor to Ubuntu 24.04
          # (glibc 2.39) and 1.2.2 shipped a Linux build that died on launch
          # for every user on Ubuntu 22.04 LTS, Debian 12 or RHEL 9:
          #   libm.so.6: version `GLIBC_2.38' not found (required by
          #   .../better_sqlite3.node)
          # 22.04 (glibc 2.35) resolves on every newer distro too, so building
          # there covers 22.04 through 25.x from one artifact.
          - name: Linux x64
            id: linux-x64
            os: ubuntu-22.04
            platform: linux
            args: --linux --x64
            unpacked: apps/desktop/release/linux-unpacked
          - name: Linux arm64
            id: linux-arm64
            os: ubuntu-22.04-arm
            platform: linux
            args: --linux --arm64
            unpacked: apps/desktop/release/linux-arm64-unpacked
          - name: Windows (x64 + arm64)
            id: win-x64-arm64
            os: windows-latest
            platform: win
            # Both arches in ONE invocation on purpose: NSIS then emits a
            # SINGLE installer carrying both payloads, which is what we want
            # users to download. Splitting them across runners would produce
            # two installers. The arm64 native addon is cross-compiled here --
            # windows-latest ships the MSVC ARM64 toolset
            # (Microsoft.VisualStudio.Component.VC.Tools.ARM64) -- and the
            # "Verify Windows native addon architecture" step below proves the
            # cross-compile actually happened.
            args: --win --x64 --arm64
            # x64 only: an x64 runner cannot execute the arm64 build, whose
            # addon CPU is verified from its PE header instead.
            smoke: apps/desktop/release/win-unpacked/Sarv Inbox.exe

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v6
        with:
          version: 8.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # The Electron binary is the single biggest cost in this workflow: a
      # ~100MB zip per target arch, downloaded twice on the macOS and Windows
      # runners (once by electron's own postinstall for the host, then once per
      # arch by electron-builder). Nothing can download it ONCE for all six
      # jobs -- every runner needs a different platform-arch build, and routing
      # the same bytes through the artifact store would only move the transfer,
      # not remove it. Caching per runner does remove it: after the first run
      # on a given lockfile, every later run restores the zips instead.
      #
      # setup-node's `cache: pnpm` covers the pnpm store only; these two
      # directories live outside it. Paths that do not exist on a given OS are
      # skipped, so one step serves all three.
      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          # The lockfile pins the Electron version, so a bump invalidates this
          # on its own; runner.arch keeps the x64 and arm64 Linux runners from
          # restoring each other's binaries.
          key: ${{ runner.os }}-${{ runner.arch }}-electron-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-electron-

      # fpm (which electron-builder shells out to for .deb/.rpm) needs the rpm
      # toolchain present to emit an .rpm at all; without it the rpm target is
      # skipped silently and the release ships without Fedora/RHEL packages.
      #
      # clang is the other half of the ubuntu-22.04 pin above. NO gcc on 22.04
      # can parse Electron's V8 headers -- `class V8_DEPRECATED("...")
      # V8_EXPORT Value` puts a GNU attribute after a C++11 one in a
      # class-head, and gcc rejects that ordering outright:
      #   v8config.h:854:20: error: expected identifier before '__attribute__'
      #   make: *** [better_sqlite3.target.mk:138: .../better_sqlite3.o] Error 1
      # Only Electron's headers reach it: V8_EXPORT is the empty macro unless
      # BUILDING_V8_SHARED is defined, which Electron does and Node does not.
      # So CI never noticed -- every other job builds this addon against NODE's
      # headers, where the same line compiles clean.
      #
      # v1.2.3 is where it landed, as the first tag built on the pinned image.
      # 1.2.2 built on ubuntu-24.04 and its default gcc 13 accepted the
      # ordering; 22.04 tops out at gcc 12, which does NOT -- 12.3.0 fails with
      # exactly the error above, so `g++-12` was a fix for the wrong version
      # number and both Linux jobs stayed red.
      #
      # clang accepts it, which is not a guess: macOS compiles this very header
      # through the same `#else // V8_OS_WIN` branch on every green release.
      # And clang is the one upgrade that cannot raise the floor the pin exists
      # to hold -- it links the libstdc++ and glibc jammy already ships, so
      # nothing newer than GLIBCXX_3.4.30 can enter the artifact. "Verify the
      # Linux build runs on an older glibc" below still proves it from the
      # binaries.
      - name: Install Linux packaging tools
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm clang
          # node-gyp's make generator resolves its compiler from $CC/$CXX
          # (CC.target ?= $(CC)), so exporting them for the REST of the job is
          # all it takes. It has to be the rest of the job, not just the
          # packaging step: `pnpm install` below runs postinstall, which builds
          # the same addon for the same Electron ABI -- and swallows its own
          # failure, so getting this wrong looks like a green install and a
          # broken package.
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"

      # NOTE: no SARVINBOX_SKIP_ELECTRON_REBUILD here, unlike the verify job.
      # The packaged app runs inside Electron, so the addons must be built for
      # Electron's ABI — that is exactly what postinstall does.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # electron-builder finds the pnpm workspace root by running
      # `pnpm --workspace-root exec pwd` and using its stdout verbatim. On the
      # Windows runners Git's coreutils pwd.exe is on PATH, so that probe
      # answers an MSYS path (/d/a/Inbox/Inbox) instead of throwing -- no
      # package.json exists there, the workspace root collapses to apps/desktop,
      # and the installer ships with NO node_modules and no better_sqlite3.node.
      # See scripts/lib/win-pwd-shim.mjs. The step fails loudly if the probe is
      # still unusable, rather than 20 minutes later with an empty installer.
      - name: Make the workspace-root probe answer a Windows path
        if: runner.os == 'Windows'
        run: node scripts/win-pwd-shim.mjs

      - name: Build libraries
        run: |
          pnpm --filter @sarvinbox/core build
          pnpm --filter @sarvinbox/storage-node build

      - name: Build renderer and main
        working-directory: apps/desktop
        run: pnpm exec tsc && pnpm exec vite build
        env:
          NODE_ENV: production
          # Inlined into the bundle by vite.config.ts. Without them the shipped
          # app has no Gmail sign-in and no crash reporting. Vite's loadEnv
          # merges SARVINBOX_*-prefixed process.env vars, so no .env is needed.
          SARVINBOX_GOOGLE_CLIENT_ID: ${{ secrets.SARVINBOX_GOOGLE_CLIENT_ID }}
          SARVINBOX_GOOGLE_CLIENT_SECRET: ${{ secrets.SARVINBOX_GOOGLE_CLIENT_SECRET }}
          SARVINBOX_SENTRY_DSN: ${{ secrets.SARVINBOX_SENTRY_DSN }}
          # Source-map upload is skipped entirely when the token is absent.
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      # Downloads the checksum-pinned system extensions into
      # build/default-extensions so a first run works offline. Non-fatal by
      # design: it warns and the app fetches them on first run instead.
      - name: Prefetch default extensions
        working-directory: apps/desktop
        run: pnpm prefetch:extensions

      - name: Package ${{ matrix.platform }}
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          EXTRA=()
          if [[ "${{ matrix.platform }}" == "mac" && "${HAS_APPLE_CERT}" == "true" ]]; then
            EXTRA+=(-c.mac.notarize=true)
            echo "Signing and notarizing with the Developer ID certificate."
          elif [[ "${{ matrix.platform }}" == "mac" ]]; then
            echo "WARN: APPLE_CERTIFICATE_P12 is not set — building an UNSIGNED app."
            echo "      Gatekeeper will block it. See docs/RELEASING.md."
          fi
          pnpm exec electron-builder ${{ matrix.args }} "${EXTRA[@]}" --publish never
        env:
          # --- macOS signing + notarization (Option A: all in CI) ---
          # CSC_LINK takes the base64 of the .p12 directly, so no certificate
          # file is ever written to the runner's disk.
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.APPLE_CERTIFICATE_P12 || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ github.token }}

      # Fail loudly if signing silently degraded. An unsigned or
      # entitlement-less build looks fine here and only breaks on a user's Mac,
      # which is far too late — and shipping hardenedRuntime with no
      # entitlements crashes V8 on launch.
      - name: Verify macOS signature and entitlements
        if: matrix.platform == 'mac' && env.HAS_APPLE_CERT == 'true'
        run: |
          set -euo pipefail
          APP=$(find apps/desktop/release -name '*.app' -maxdepth 3 | head -1)
          echo "Verifying $APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --display --entitlements :- "$APP" 2>/dev/null | grep -q 'allow-jit' \
            || { echo "FAIL: signed app carries no entitlements"; exit 1; }
          echo "OK: signature and entitlements present"

      # A cross-compiled addon that silently fell back to the host CPU still
      # builds, packs and installs -- it only fails on a real arm64 machine,
      # and not as a crash: every DB read is try/catch'd, so it looks like an
      # account with no mail. Cheaper to check the PE header than to ship it.
      - name: Verify Windows native addon architecture
        if: matrix.platform == 'win'
        shell: bash
        run: |
          node scripts/verify-win-arch.mjs \
            apps/desktop/release/win-unpacked=x64 \
            apps/desktop/release/win-arm64-unpacked=arm64

      # The universal merge is the step that can silently halve the app: if
      # lipo ever keeps one slice, the dmg still builds, signs, notarizes and
      # installs, and fails only for users on the missing CPU -- as an app with
      # no mail, not as a crash, because every DB read is try/catch'd. Reading
      # the Mach-O fat header costs milliseconds.
      - name: Verify the macOS build is really universal
        if: matrix.platform == 'mac'
        shell: bash
        run: node scripts/verify-mac-arch.mjs apps/desktop/release/mac-universal=x64,arm64

      # The v1.2.0 tag built four green artifacts that were all EMPTY: a false
      # from build/beforeBuild.js told electron-builder 26 that node_modules
      # were handled externally, so it packed none, on every platform. Only the
      # Windows job noticed, because only the Windows job looked inside the
      # artifact. This makes macOS and Linux look too. Windows is excluded
      # because the step above already checks every addon, and its CPU.
      - name: Verify the packed app carries its native addons
        if: matrix.platform != 'win'
        shell: bash
        run: node scripts/verify-packaged-addons.mjs apps/desktop/release

      # glibc is backward compatible and never forward, so a binary linked on a
      # newer distribution than the user's refuses to load there -- and the
      # build machine can never notice, because its own glibc is always new
      # enough. v1.2.2 shipped exactly that: built on `ubuntu-latest` after
      # GitHub moved the label to 24.04, it died on launch for everyone on
      # Ubuntu 22.04 LTS with `version GLIBC_2.38 not found`, having passed
      # every check above. This reads the artifacts instead of trusting the pin.
      - name: Verify the Linux build runs on an older glibc
        if: matrix.platform == 'linux'
        shell: bash
        run: node scripts/verify-glibc-floor.mjs "${{ matrix.unpacked }}" --max=2.35

      # Installing through apt is the point, not a convenience: it resolves the
      # .deb's declared dependencies exactly as a user's machine would, so a
      # missing one fails here rather than on their desktop. Electron needs a
      # display to reach app.whenReady at all, hence xvfb.
      - name: Install the Linux package the way a user would
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          DEB=$(ls apps/desktop/release/*.deb | head -1)
          echo "Installing $DEB"
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb "$DEB"

      # Every check above reads the artifact, and reading a binary cannot tell
      # you it runs: v1.2.2 was signed, verified, uploaded and dead on launch.
      # This starts the packaged app for real -- SARV_SMOKE_TEST makes it boot,
      # prove better-sqlite3 loads, print a marker and exit 0 without touching a
      # database. Windows arm64 is not covered: an x64 runner cannot execute it,
      # which is what "Verify Windows native addon architecture" is for.
      - name: Smoke-launch the packaged app
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.platform }}" == "linux" ]]; then
            xvfb-run -a node scripts/smoke-launch.mjs "/opt/Sarv Inbox/sarv-inbox"
          else
            node scripts/smoke-launch.mjs "${{ matrix.smoke }}"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.id }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.rpm
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml
          if-no-files-found: error # an empty artifact set must fail, not publish
          retention-days: 14

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # the only job that can write to the repo
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Derive version from the tag
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # Release notes come from CHANGELOG.md rather than being regenerated, so
      # the release page and the changelog can never disagree. Exits non-zero
      # if the version has no section, rather than publishing empty notes.
      - name: Extract release notes
        run: node scripts/changelog.mjs notes "${{ steps.version.outputs.version }}" > RELEASE_NOTES.md

      - name: List artifacts
        run: ls -lh artifacts/

      # Published as a DRAFT: a human checks the artifact list and clicks
      # publish. Nothing reaches users without that click — electron-updater
      # cannot see draft releases, so the draft is also the auto-update gate.
      # The latest*.yml files in the upload glob above are what drives it.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            artifacts/* \
            --repo "${{ github.repository }}" \
            --title "Sarv Inbox ${{ steps.version.outputs.version }}" \
            --notes-file RELEASE_NOTES.md \
            --draft \
            --verify-tag
